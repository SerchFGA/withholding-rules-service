<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Withholding rules service</title>
<style>
:root { --bg: #f5f6f8; --card: #fff; --fg: #1a1f27; --mut: #55606e; --line: #cfd5dd; --acc: #1d4f91; --err: #a11f1f; }
html { background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; }
body { margin: 0 auto; max-width: 60rem; padding: 1rem; }
h1, h2 { font-size: 1.25rem; margin: 0 0 .75rem; }
h3 { font-size: .8rem; margin: 1rem 0 .25rem; text-transform: uppercase; color: var(--mut); }
p { margin: .25rem 0; }
a { color: var(--acc); overflow-wrap: anywhere; }
.err { color: var(--err); font-weight: 600; }
.muted, small { color: var(--mut); font-size: .875rem; }
section { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 1rem; margin: 1rem 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: .75rem; align-items: end; }
label { display: block; font-size: .875rem; font-weight: 600; }
input, select, button { font: inherit; padding: .45rem .6rem; border: 1px solid #77818f; border-radius: 4px; }
.grid input, .grid select, .grid button { width: 100%; box-sizing: border-box; }
button { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; cursor: pointer; }
:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
.dec { border-left: 6px solid var(--acc); padding: .5rem .9rem; font-size: 1.6rem; font-weight: 700; }
.warn { background: #fff4d6; color: #664400; border: 1px solid; padding: .6rem .9rem; margin-top: .75rem; }
blockquote { margin: .5rem 0 0; padding-left: .75rem; border-left: 3px solid var(--line); overflow-wrap: anywhere; }
.scroll { overflow-x: auto; margin-top: .75rem; }
table { border-collapse: collapse; width: 100%; min-width: 46rem; font-size: .875rem; }
th, td { text-align: left; vertical-align: top; padding: .4rem .6rem; border-bottom: 1px solid var(--line); }
.pager { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; margin-top: .75rem; }
#dl { list-style: none; padding: 0; }
#dl li, #dl span { display: block; padding: .25rem 0; }
</style>
</head>
<body>
<h1>Withholding rules service</h1>
<p id="health" class="muted" role="status">Loading…</p>
<main>
<section aria-labelledby="h-q"><h2 id="h-q">Resolve a payment</h2>
  <form id="qf" class="grid" novalidate>
    <div><label for="pt">Payment type</label><select id="pt"></select></div>
    <div><label for="ju">Jurisdiction</label><select id="ju"></select></div>
    <div><label for="pe">Payee type</label><select id="pe"></select></div>
    <div><label for="am">Amount</label><input id="am" type="number" min="0" step="any" required></div>
    <div><label for="yr">Tax year</label><input id="yr" type="number" min="2000" max="2100" value="2026" required></div>
    <div><button id="qb" type="submit">Resolve</button></div>
  </form>
  <div id="out" aria-live="polite"><p class="muted">Fill in the form and press Resolve to see a decision.</p></div>
</section>
<section aria-labelledby="h-ru"><h2 id="h-ru">Extracted rules</h2>
  <div class="grid">
    <div><label for="fj">Jurisdiction</label><select id="fj"></select></div>
    <div><label for="fp">Payment type</label><select id="fp"></select></div>
  </div>
  <div class="scroll" tabindex="0" role="region" aria-labelledby="h-ru">
    <table>
      <thead><tr>
      <th>Jurisdiction</th><th>Payment type</th><th>Year</th><th>Rate</th><th>Threshold</th><th>Page</th><th>Quote</th>
      </tr></thead>
      <tbody id="rb"></tbody>
    </table>
  </div>
  <div class="pager">
    <button id="prev" type="button" disabled>Previous</button> <button id="next" type="button" disabled>Next</button>
    <span id="rs" class="muted" aria-live="polite">Loading…</span>
  </div>
</section>
<section aria-labelledby="h-d"><h2 id="h-d">Documents</h2>
  <ul id="dl"><li class="muted">Loading…</li></ul>
  <h3>Ingest a document</h3>
  <form id="inf" class="grid" novalidate>
    <div><label for="iu">Document URL (https)</label><input id="iu" type="url" autocomplete="off" required></div>
    <div><label for="ik">Ingest key</label><input id="ik" type="password" autocomplete="off" required></div>
    <div><button id="ib" type="submit">Ingest</button></div>
  </form>
  <div id="ins" aria-live="polite"></div>
</section>
</main>
<script>
const JUR = {'US-FED': 'United States, federal', 'CA-ON': 'Canada, Ontario', CO: 'Colombia'};
const PAYEE = {resident: 'Resident', non_resident: 'Non-resident', government: 'Government'};
const STATUS = {complete: '✓ Complete', partial: '◐ Partial: read only in part'};
const PAYMENT = {
  services: 'Services', wages: 'Wages', supplemental_wages: 'Supplemental wages',
  gambling_winnings: 'Gambling winnings', pension_nonperiodic: 'Pension, nonperiodic payment',
  pension_periodic: 'Pension, periodic payment', eligible_rollover_distribution: 'Eligible rollover distribution',
  unemployment_compensation: 'Unemployment compensation', sick_pay: 'Sick pay', interest: 'Interest',
  dividends: 'Dividends', social_security_tax: 'Social security tax', medicare_tax: 'Medicare tax',
  cpp_contribution: 'CPP contribution', ei_premium: 'EI premium', other: 'Other'
};
const POLICY = {higher_of_percent_or_flat: 'the higher of percentage or fixed amount'};
POLICY.later_tax_year = 'most recent tax year available';
const REASON = {
  no_rate_in_publication: 'The publication does not state a rate for this payment.',
  no_rule_for_tax_year: 'There is no rule for that tax year.', source_page_was_scanned: 'The source page was scanned.',
  tax_year_ambiguous_resolved_to_later: 'The tax year is ambiguous: the most recent one available was used.',
  conditional_on_payee_tin: 'It depends on whether the payee provided a taxpayer identification number.',
  optional_withholding_method: 'The rate is an optional withholding method.',
  conflicting_rules: 'There are rules that contradict each other.',
  condition_not_evaluable: 'The rule has a condition the service cannot check.',
  unsupported_rule_structure: 'There is a cap, bracket or table the service does not compute.',
  document_partially_read: 'A document was read only in part.', payee_type_not_provided: 'No payee type was provided.'
};
const ERR = {
  0: 'Could not reach the service.', 401: 'The ingest key is missing or incorrect.',
  422: 'The request is not valid. Check the values and try again.',
  502: 'The document could not be downloaded from that URL.', 504: 'The service ran out of time. Try again.'
};
let off = 0;
const $ = id => document.getElementById(id);
const name = (map, k) => map[k] || String(k);   // an unknown key is shown as is
function el(tag, text, cls, ...kids) {
  const e = Object.assign(document.createElement(tag), {textContent: text ?? '', className: cls || ''});
  e.append(...kids);
  return e;
}
const list = (tag, items) => el(tag, null, '', ...items.map(i => el('li', i)));
const warn = (title, items) => el('div', null, 'warn', el('strong', '! ' + title), list('ul', items));
function link(url) {   // https only; anything else stays as text
  if (!/^https:\/\//i.test(String(url))) return el('span', String(url));
  return Object.assign(el('a', url), {href: url, rel: 'noopener noreferrer', target: '_blank'});
}
function pct(r) {   // "0.0620" to "6.2%" by moving the point in the text, without floating point
  const m = /^(\d+)(?:\.(\d+))?$/.exec(String(r));
  if (!m) return String(r);
  const frac = (m[2] || '').padEnd(2, '0');
  const moved = (m[1] + frac.slice(0, 2)).replace(/^0+(?=\d)/, '') + '.' + frac.slice(2);
  return moved.replace(/\.?0*$/, '') + '%';
}
function say(o) {
  if (!o.withholding_applies) return o.withholding_applies == null ? 'Unknown: review required' : 'No withholding';
  if (o.rate != null) return 'Withhold ' + pct(o.rate);
  return 'Withhold a fixed amount' + (o.flat_amount ? ': ' + o.flat_amount : '');
}
async function api(path, opt) {   // never throws: a network failure comes back as status 0 and is shown
  const r = await fetch(path, opt).catch(() => null);
  const body = (r && await r.json().catch(() => null)) || {};
  return {ok: !!r && r.ok, status: r ? r.status : 0, body};
}
function errEl(x, tag) {
  const b = x.body, detail = typeof b.detail === 'string' ? b.detail : null;
  const more = [x.status || null, b.error, detail, b.request_id].filter(Boolean).join(' · ');
  const text = '✕ ' + (ERR[x.status] || 'The service returned an unexpected error.') + ' ';
  return el(tag || 'p', text, 'err', el('small', more && '[' + more + ']'));
}
function fill(id, map, first) {
  const s = $(id), v = s.value;
  s.replaceChildren(...(first ? [new Option(first, '')] : []));
  for (const k of Object.keys(map)) s.append(new Option(map === JUR ? map[k] + ' (' + k + ')' : map[k], k));
  if (v) s.value = v;
}
function renderResult(x) {
  const box = $('out');
  if (typeof x === 'string') return box.replaceChildren(el('p', x, x.startsWith('✕') ? 'err' : 'muted'));
  if (!x.ok) return box.replaceChildren(errEl(x));
  const b = x.body, o = b.outcome || {}, p = b.policy_outcome || {}, prov = b.provenance || [];
  box.replaceChildren(el('div', say(o), 'dec'));
  const reasons = (b.review_reasons || []).map(r => name(REASON, r));
  if (b.requires_human_review) box.append(warn('Requires human review', reasons));
  const same = o.withholding_applies === p.withholding_applies && o.rate === p.rate && o.basis === p.basis;
  const policy = same && !p.flat_amount ? 'The client policy does not change the result.' : say(p);
  box.append(el('h3', 'With the client policy'), el('p', policy));
  const applied = (b.policy_applied || []).map(a => name(POLICY, a));
  if (applied.length) box.append(el('p', 'Policy applied: ' + applied.join(', '), 'muted'));
  const cite = s => [el('blockquote', `“${s.quote}”`), el('p', `Page ${s.page} · `, 'muted', link(s.source_url))];
  const none = el('p', 'No document is cited: a fixed rule of the service decided this.', 'muted');
  const known = typeof o.withholding_applies === 'boolean';
  if (prov.length || known) box.append(el('h3', 'Source'), ...(prov.length ? prov.flatMap(cite) : [none]));
  const sec = (b.security_events || []).map(e => 'Page ' + e.page + ': ' + e.excerpt);
  const attempt = 'An instruction attempt was detected inside a document; it did not change the result.';
  if (sec.length) box.append(warn(attempt, sec));
}
function renderRules(x) {
  const items = (x.ok && x.body.items) || [], total = x.body.total || 0;
  $('rb').replaceChildren();
  for (const r of items) {
    const rate = r.rate != null ? pct(r.rate) : r.flat_amount != null ? 'fixed ' + r.flat_amount : '·';
    const min = r.min_amount != null ? (r.threshold_inclusive ? '≥ ' : '> ') + r.min_amount : '·';
    const cells = [r.jurisdiction, name(PAYMENT, r.payment_type), r.tax_year, rate, min, r.page, '“' + r.quote + '”'];
    $('rb').append(el('tr', null, '', ...cells.map(v => el('td', v))));
  }
  const range = total ? (off + 1) + '–' + (off + items.length) + ' of ' + total : 'No rules match.';
  $('rs').replaceChildren(x.ok ? range : errEl(x, 'span'));
  $('prev').disabled = off <= 0;
  $('next').disabled = off + 20 >= total;
}
function renderDocs({ok, body}, x) {
  const text = `${body.documents} documents ingested · rules version ${String(body.rules_version || '').slice(0, 12)}`;
  $('health').textContent = ok ? text : '✕ Service status unavailable';
  if (!x.ok) return $('dl').replaceChildren(errEl(x, 'li'));
  const rows = (x.body.items || []).map(d => {
    const when = new Date(d.ingested_at), style = {dateStyle: 'medium', timeStyle: 'short'};
    const date = isNaN(when) ? String(d.ingested_at) : when.toLocaleString('en', style);
    const claims = `claims: ${d.claims_total - d.claims_rejected} accepted, ${d.claims_rejected} discarded`;
    const info = el('span', [d.pages + ' pages', claims, date].join(' · '), 'muted');
    return el('li', null, '', link(d.source_url), el('span', name(STATUS, d.status)), info);
  });
  if (!rows.length) rows.push(el('li', 'No documents ingested yet.', 'muted'));
  $('dl').replaceChildren(...rows);
}
function renderIngest(x) {
  if (typeof x === 'string') return $('ins').replaceChildren(el('p', x, x.startsWith('✕') ? 'err' : 'muted'));
  if (!x.ok) return $('ins').replaceChildren(errEl(x));
  const b = x.body, rows = [['Status', STATUS[b.status] || b.status], ['Rules stored', b.rules_stored]];
  const done = b.cached ? '✓ Already ingested with the same content. Nothing changed.' : '✓ Ingestion finished.';
  $('ins').replaceChildren(el('p', done), list('ul', rows.filter(r => r[1] != null).map(r => r.join(': '))));
}
async function loadRules(offset) {
  off = Math.max(0, offset);
  const q = new URLSearchParams({limit: 20, offset: off});
  if ($('fj').value) q.set('jurisdiction', $('fj').value);
  if ($('fp').value) q.set('payment_type', $('fp').value);
  renderRules(await api('/v1/rules?' + q));
}
async function loadDocs() {   // a new document may bring a jurisdiction with no known name: it is listed by its key
  const [health, docs] = await Promise.all([api('/health'), api('/v1/documents')]);
  for (const j of health.body.jurisdictions || []) JUR[j] = JUR[j] || j;
  fill('ju', JUR);
  fill('fj', JUR, 'All');
  renderDocs(health, docs);
}
$('qf').addEventListener('submit', async e => {
  e.preventDefault();
  const am = $('am').value.trim(), yr = Number($('yr').value);
  if (!(Number(am) > 0)) return renderResult('✕ Amount must be a number greater than 0.');
  if (!Number.isInteger(yr) || yr < 2000 || yr > 2100) return renderResult('✕ Tax year must be between 2000 and 2100.');
  const q = new URLSearchParams({payment_type: $('pt').value, amount: am, jurisdiction: $('ju').value, tax_year: yr});
  if ($('pe').value) q.set('payee_type', $('pe').value);
  $('qb').disabled = true;
  renderResult('Loading…');
  renderResult(await api('/v1/resolve?' + q));
  $('qb').disabled = false;
});
for (const id of ['fj', 'fp']) $(id).addEventListener('change', () => loadRules(0));
for (const [id, step] of [['prev', -20], ['next', 20]]) $(id).addEventListener('click', () => loadRules(off + step));
$('inf').addEventListener('submit', async e => {
  e.preventDefault();
  const url = $('iu').value.trim(), key = $('ik').value;
  if (!url || !key) return renderIngest('✕ Enter the document URL and the ingest key.');
  $('ib').disabled = true;
  renderIngest('Processing. This can take up to 2 minutes…');
  const headers = {'Content-Type': 'application/json', 'X-Ingest-Key': key};
  const res = await api('/v1/documents', {method: 'POST', headers, body: JSON.stringify({source_url: url})});
  $('ib').disabled = false;
  renderIngest(res);
  if (res.ok) await Promise.all([loadRules(0), loadDocs()]);
});
fill('pt', PAYMENT);
fill('pe', PAYEE, 'Not specified');
fill('fp', PAYMENT, 'All');
loadRules(0);
loadDocs();
</script>
</body>
</html>
